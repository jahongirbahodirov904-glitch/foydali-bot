<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>LIFE MANAGER</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="eyebrow">SHAXSIY REJALASHTIRUVCHI</div>
      <h1>Life Manager <span>✦</span></h1>
      <p>Vaqtingni rejalashtir. Maqsadingga erish.</p>
      <div class="date-pill" id="todayLabel">📅 Bugungi rejalaring</div>
    </header>

    <section class="panel">
      <div class="section-heading"><div><span class="section-icon">＋</span><h2>Yangi reja</h2></div></div>
      <form id="planForm">
        <label for="task">Nima qilmoqchisan?</label>
        <textarea id="task" maxlength="160" rows="2" placeholder="Masalan: Ingliz tilini o‘rganish" required></textarea>
        <div class="field-grid">
          <div><label for="date">📆 Sana</label><input id="date" type="date" required></div>
          <div><label for="time">⏰ Vaqt</label><input id="time" type="time" required></div>
        </div>
        <button class="primary" type="submit">＋ Rejani saqlash</button>
        <p id="formMessage" class="message" role="status"></p>
      </form>
    </section>

    <section class="plans-section">
      <div class="section-heading"><div><span class="section-icon">☷</span><h2>Mening rejalarim</h2></div><span id="planCount" class="count">0 ta</span></div>
      <div id="planList" class="plan-list"><div class="empty">⏳ Rejalar yuklanmoqda...</div></div>
    </section>
    <footer>🔔 Vaqti kelganda Telegram orqali eslatma olasan.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
